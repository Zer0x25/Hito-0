name: Hito 0 seed contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/verify.sh scripts/install-hooks.sh scripts/tests/verify-contract.sh .githooks/pre-commit
      - name: Test phase-aware quality gate
        run: bash scripts/tests/verify-contract.sh
      - name: Verify seed structure or selected project profile
        run: ./scripts/verify.sh
